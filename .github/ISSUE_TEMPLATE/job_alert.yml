name: "🎯 New Job Match Alert"
description: "Auto-generated by Job Agent when a job matches the candidate profile above threshold"
title: "[MATCH] <company> — <job_title>"
labels: ["job-match", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        This issue was created by **Job Agent** (discovery → verification → matching pipeline).
        Please review in COPILOT mode before submitting an application.
  - type: input
    id: title
    attributes:
      label: Job Title
      placeholder: "Civil Project Engineer – Site Design"
    validations:
      required: true
  - type: input
    id: company
    attributes:
      label: Company
      placeholder: "Olsson"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Verified Job URL (HTTP 200 checked by agent)
      placeholder: "https://job-boards.greenhouse.io/..."
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source Adapter
      options: [greenhouse, lever, wwgr, remotive, linkedin, indeed]
    validations:
      required: true
  - type: input
    id: score
    attributes:
      label: Match Score (0–100)
      description: Computed by the matching module against the stored resume
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why this matched
      placeholder: "Keywords: civil engineering, stormwater, roadway, project management..."
  - type: checkboxes
    id: action
    attributes:
      label: Human Decision (COPILOT gate)
      options:
        - label: Approve — queue for AUTONOMOUS submit
        - label: Reject — add to cooldown list
