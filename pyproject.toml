[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "AI-assisted job application platform: discovery, verification, matching, and managed applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
job-agent = "core.__main__:main"

[tool.setuptools]
# The repository root IS the `core` package (it contains __init__.py / __main__.py).
package-dir = { core = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["storage*", "resume*", "tests*"]
